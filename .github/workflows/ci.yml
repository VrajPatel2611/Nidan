name: CI

# Every check below must pass before a pull request can merge. The
# detector-validation job is the unusual one: it fails the build if the
# published research figure degrades (TECH_SPEC §9.4, ADR-0004).

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy (domain, strict)
        # Strict on domain/ only. It is the pure layer and the part that must be
        # correct; api/ and infra/ are covered by tests and are being replaced
        # (T-030).
        run: mypy nidan/domain --strict

      - name: import-linter (ADR-0009 layering contract)
        run: lint-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: pytest
        # Coverage gate (>=90% on nidan.domain) is configured in pyproject.toml.
        # No test may make a network call — enforced by an autouse fixture.
        run: pytest -m "not slow" -q
        env:
          GROQ_API_KEY: not-a-real-key-tests-must-never-call-a-model

  test-windows:
    # A SEPARATE job, not a matrix on `test`. A matrix would rename the existing
    # check to "Tests (ubuntu-latest)", and the branch ruleset requires a check
    # called exactly "Tests" — which would then never appear, blocking every PR.
    #
    # This exists because six tests failed on a Windows machine that had passed
    # CI six times: open() and read_text() without an explicit encoding use the
    # LOCALE codec, which is cp1252 on Windows, and the repository is full of
    # UTF-8. Linux-only CI cannot see that class of bug.
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -m "not slow" -q
        env:
          GROQ_API_KEY: not-a-real-key-tests-must-never-call-a-model

  database:
    # Separate job, like Tests (Windows), so the required-check name "Tests"
    # keeps working and a schema failure reports itself as a schema failure.
    #
    # These tests start a real PostgreSQL 16 + pgvector container and migrate it
    # from scratch. They cannot run on SQLite: every guarantee they check —
    # partial unique indexes, CHECK constraints, append-only triggers, the
    # publication gate, RLS — is a PostgreSQL feature.
    #
    # Since T-012 they also cover the repository layer: that the application
    # runs as a role RLS applies to, and that a second user's rows are
    # invisible to it. Those skip silently without Docker, so this job is the
    # only place they are guaranteed to run.
    name: Database schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Migrations, constraints, triggers, RLS and tenant scoping
        run: pytest tests/db -q --no-cov

  validation:
    name: Detector validation (research claim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .

      - name: Detector accuracy must not drop below 94%
        # THIS IS THE UNUSUAL ONE. The published paper reports 94% accuracy
        # across all detector decisions. This script exits non-zero below that,
        # so no change can silently degrade the instrument the claim rests on.
        #
        # If this fails: do not lower MINIMUM_ACCURACY. Find out what changed.
        run: python validate_detectors.py

      - name: Upload the validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detector-validation
          path: docs/detector_validation.md

  case-invariants:
    name: Case content invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: C-1 … C-9
        # Separate job so a content error is reported as a content error rather
        # than buried in a 227-test run. C-4 is the invariant whose absence cost
        # 14% sensitivity (T-003); C-8 and C-9 came out of T-002.
        run: pytest tests/test_case_invariants.py -v --no-cov

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gitleaks scans history, not just the diff

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: pip-audit (SECURITY_SPEC §5.2)
        run: pip-audit --skip-editable

      - name: gitleaks (BUILD_PLAN T-006 · SECURITY_SPEC §5.1)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        # Build only — not pushed. Deployment is T-045.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nidan:ci

  web:
    name: Web app
    # The learner-facing Next.js app (BUILD_PLAN T-032, ADR-0006).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci

      - name: API types match openapi.yaml (T-032 criterion 2)
        # Fails when the contract changed and `npm run gen:api` was not run.
        # Also the only strict parse openapi.yaml gets — PyYAML forgives
        # duplicated keys.
        run: npm run check:api

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: npm audit (SECURITY_SPEC §5.2)
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build
