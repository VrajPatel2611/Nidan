<div id="section-persona" class="card editor-section">
  <div class="card-title" style="display: flex; justify-content: space-between; align-items: center;">
    <span>Patient Persona & LLM System Prompt</span>
    <span id="token-counter" style="font-size: 13px; color: #38bdf8; font-family: monospace;">≈ 0 tokens</span>
  </div>
  
  <p style="font-size: 13px; color: #94a3b8; margin-bottom: 8px;">
    System prompt driving the Virtual Patient LLM. Governs conversation tone, medical disclosure rules, and persona boundaries.
  </p>

  <textarea id="system_prompt" name="system_prompt" rows="12" oninput="updateTokenCount()" style="width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 4px; font-family: monospace; font-size: 13px; line-height: 1.4;" required>{{ content.get('system_prompt', '') }}</textarea>
</div>

<script>
function updateTokenCount() {
  const text = document.getElementById("system_prompt").value || "";
  const approxTokens = Math.round(text.length / 4);
  document.getElementById("token-counter").innerText = `≈ ${approxTokens} tokens`;
}
document.addEventListener("DOMContentLoaded", updateTokenCount);
</script>
