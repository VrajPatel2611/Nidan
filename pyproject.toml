[project]
name = "nidan"
version = "0.2.0"
description = "A bias-aware virtual patient simulator for clinical reasoning training"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "groq>=1.6",
    "python-dotenv>=1.2",
    "pydantic-settings>=2.0",
    "sentry-sdk[flask]>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # JWT verification against Supabase's JWKS (ADR-0002, T-014). The [crypto]
    # extra pulls in `cryptography`, which is what verifies an RS256/ES256
    # signature — without it PyJWT silently supports only HMAC, and the
    # asymmetric path this depends on raises at runtime rather than at install.
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8", "pytest-cov>=5", "hypothesis>=6",
    "import-linter>=2", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7",
    "pyyaml>=6",
    "testcontainers[postgres]>=4",
    # Neither of these is a dependency of ours — both ship with the virtualenv.
    # They are pinned above known advisories so a FRESH environment is
    # audit-clean without anyone remembering to upgrade by hand.
    #
    # setuptools: PYSEC-2026-3447, found by CI in T-004 — it passed locally
    # only because one developer had upgraded it manually.
    # pip: PYSEC-2026-196 and PYSEC-2026-3721, found in T-011. Same shape,
    # second time; pinning both is what stops a third.
    "setuptools>=83",
    "pip>=26.2",
]
# Runtime-only extras for the container image (T-004 Dockerfile).
prod = ["gunicorn>=22"]
# Document generation only — `python scripts/build_docx.py`. Deliberately NOT in
# `dev`: CI has no reason to install it, and a .docx is never a build artefact.
docs = ["python-docx>=1.1"]

[project.scripts]
nidan = "nidan.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nidan*"]

[tool.setuptools.package-data]
nidan = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# PLW1514 (unspecified-encoding) is why this list has a pylint rule in it:
# open()/read_text() without an encoding uses the LOCALE codec, which is
# cp1252 on Windows. Six tests failed on a teammate's machine with
# UnicodeDecodeError before this was enabled.
select = ["E", "F", "W", "I", "UP", "B", "PLW1514"]
# PLW1514 is a preview rule. `explicit-preview-rules` turns on the ones named
# above and nothing else, so enabling it does not drag in every other
# unreleased check.
preview = true
explicit-preview-rules = true
ignore = ["E501"]          # long lines are tolerated in clinical content

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: excluded from the default run"]
# Coverage is enforced on domain/ only. Chasing it on I/O glue produces tests
# that assert mocks (TECH_SPEC §12).
addopts = "--cov=nidan.domain --cov-report=term-missing --cov-fail-under=90"

# Layering contract (ADR-0009), enforced in CI by T-004.
# domain/ is pure: it must not reach into infrastructure or the web layer.
[tool.importlinter]
root_package = "nidan"

[[tool.importlinter.contracts]]
name = "domain must not import infra or api"
type = "forbidden"
source_modules = ["nidan.domain"]
forbidden_modules = ["nidan.infra", "nidan.api", "nidan.app"]

# T-012. The engine is the only source of an unscoped connection, so keeping
# its import surface inside nidan.infra.db is what makes repo_scope the only
# door into the database rather than merely the front one.
# tests/test_db_access.py checks the same thing locally and more thoroughly.
[[tool.importlinter.contracts]]
name = "only infra.db may reach the connection pool"
type = "forbidden"
# nidan.api and nidan.app are deliberately absent, and it is worth saying why.
#
# Since T-013 the routes reach the database — through `repo_scope`, which is
# the point — so `nidan.app -> routes -> repositories -> base -> engine` is a
# real import path. import-linter counts indirect imports, and cannot express
# "must not import this DIRECTLY", so listing them here would forbid the
# architecture rather than the violation.
#
# The rule that actually matters — no module outside nidan/infra/db names the
# engine itself — is checked by tests/test_db_access.py, which reads the source
# and can tell a direct import from a transitive one. This contract covers the
# layers that must not reach the database by any path at all.
#
# nidan.infra.session_store was deleted in T-013; SESSION_STORE is gone.
source_modules = ["nidan.domain", "nidan.infra.llm",
                  "nidan.infra.telemetry", "nidan.infra.storage",
                  "nidan.infra.feedback"]
forbidden_modules = ["nidan.infra.db.engine"]
