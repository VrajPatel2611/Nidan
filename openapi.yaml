openapi: 3.1.0

# Nidan v1 API.
#
# Written from docs/spec/API_CONTRACT.md, which is the contract; where they
# disagree, this file is the bug.
#
# BUILD_PLAN calls this sync point S-1. Its purpose is to let the frontend
# track start before the backend exists: generate a typed client from this,
# mock against it, and build screens while T-030 implements the endpoints.
# Every operation therefore currently returns 501.
#
# CHANGE THIS FILE IN THE SAME COMMIT AS THE CODE (CLAUDE.md conventions).
# A contract that lags the implementation is worse than no contract, because
# the client is generated from it and the drift is silent.

info:
  title: Nidan API
  version: 1.0.0
  description: |
    A bias-aware virtual patient simulator. Trainees interview an LLM-driven
    patient, order examinations and investigations, submit a diagnosis, and
    receive feedback on **how they reasoned**.

    Two guarantees shape this API and must not be broken by any change:

    - **No assessment state is exposed during a consultation** (`PRD` P2).
      There is no endpoint returning coverage, question counts, topic hints or
      readiness. Contract tests CT-1 and CT-2 assert their absence.
    - **No bias vocabulary appears in any response** (`PRD` P1). Not "bias",
      "anchoring", "premature closure" or "confirmation bias". Contract test
      CT-5 asserts this over rendered output.

servers:
  - url: https://api.nidan.app/v1
    description: Production
  - url: http://localhost:8000/v1
    description: Local

tags:
  - name: identity
  - name: catalogue
  - name: consultation
  - name: history
  - name: billing
  - name: admin

security:
  - bearerAuth: []

paths:
  # ── identity ───────────────────────────────────────────────────────
  /me:
    post:
      tags: [identity]
      summary: Create or claim a profile
      description: >
        Idempotent. Pass `anonymous_id` to claim a trial session taken before
        signup; the window is 30 days (`PRD` FR-2).
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileCreate' }
      responses:
        # 201 on creation, 200 when the profile already existed. Both are
        # success — the guarantee is idempotency, not a fixed status — and the
        # difference tells a client whether onboarding still needs showing.
        '201': { $ref: '#/components/responses/Profile' }
        '200': { $ref: '#/components/responses/Profile' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      tags: [identity]
      summary: The authenticated user's profile
      responses:
        '200': { $ref: '#/components/responses/Profile' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    patch:
      tags: [identity]
      summary: Update profile fields
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Profile' }
        '404':
          description: >
            No profile yet. A PATCH does not create one — POST /me does
            (API_CONTRACT §4).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [identity]
      summary: Delete the account
      description: >
        Executes DATA_MODEL §10.2. Irreversible, and it requires
        `{"confirmation": "DELETE"}` — checked here as well as by S-20's
        disabled button, because a destructive endpoint should not rely on a
        client having implemented the guard.

        **202, not 204** (changed when API-9 was settled, 22 Nov 2026). The
        database half completes before this returns: billing cancelled, the
        profile anonymised, every `payload->text` redacted, feedback prose
        replaced. What remains are three outbound calls we do not own —
        deleting the credential at Supabase (ADR-0002), cancelling at the
        payment provider, and the confirmation email S-20 promises — so 202
        means "your data is erased, the external cleanup follows", and
        `completes_within_hours` carries S-20's 24 h.

        This returned 501 until migration 033. §10.2's erasure UPDATEs
        session_events, which migration 010 made append-only with an
        unconditional trigger that refused even the table owner; 033 replaces
        it with one that permits a single state transition — `payload->text`
        becoming `"[redacted]"`, with every other column identical — and
        refuses everything else, DELETE included. See ADR-0018.

        Session results and the research pseudonym are **retained** so
        published analyses stay interpretable, and `retained` says so in the
        response as well as on the screen that preceded it: a user has a
        right to know what does not disappear.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountDeletion' }
      responses:
        '202':
          description: Erased; external cleanup follows within 24 h
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErasureAccepted' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /me/export:
    post:
      tags: [identity]
      summary: Request a data export
      responses:
        '202': { description: Export queued }

  # ── catalogue ──────────────────────────────────────────────────────
  /catalog/examinations:
    get:
      tags: [catalogue]
      summary: Every examination a learner may order
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: 'API_CONTRACT §5: public, max-age=3600'
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogItem' }

  /catalog/investigations:
    get:
      tags: [catalogue]
      summary: Every investigation a learner may order
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: 'API_CONTRACT §5: public, max-age=3600'
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogItem' }

  # ── consultation ───────────────────────────────────────────────────
  /sessions:
    post:
      tags: [consultation]
      summary: Start a consultation
      description: >
        The case is selected by the server (`PRD` FR-3). The learner does not
        choose, and the response carries no indication of what is being tested.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreate' }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '403':
          description: Free allowance exhausted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      tags: [history]
      summary: Past sessions, newest first
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPage' }
        '422':
          description: Unreadable cursor or limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /trial/sessions:
    post:
      tags: [consultation]
      summary: Start the anonymous trial
      description: One per browser. Sets an httpOnly `anonymous_id` cookie.
      security: []
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Trial already used
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [consultation]
      summary: Resume a consultation
      description: >
        Returns the transcript and what has been ordered. **Never** returns
        coverage, question counts against a target, or readiness (CT-1, CT-2).
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '404':
          description: >
            Absent, **or not yours** (API_CONTRACT §2.7). A 403 would confirm
            the session exists, so the two are indistinguishable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sessions/{id}/questions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [consultation]
      summary: Ask the patient a question
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionCreate' }
      responses:
        '201':
          description: The patient's reply
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientReply' }
        '422':
          description: Too long, or real patient data detected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 40-question cap reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Already submitted — a diagnosis is irreversible
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: >
            Model unavailable. The question is NOT consumed and the typed text
            is preserved for retry (T-031). The question event is appended
            only after the reply returns, so nothing is written on failure —
            which also keeps question_count honest, since it feeds the
            premature-closure detector.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sessions/{id}/examinations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [consultation]
      summary: Perform an examination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, example: cardiovascular }
      responses:
        '201':
          description: The finding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResult' }
        '404': { $ref: '#/components/responses/Error' }

  /sessions/{id}/investigations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [consultation]
      summary: Order an investigation
      description: >
        Search filters by name only, never ranked by relevance to the case —
        ranking would leak the answer (`UX_SPEC` S-10).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, example: troponin_0h }
      responses:
        '201':
          description: The result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResult' }
        '404': { $ref: '#/components/responses/Error' }

  /sessions/{id}/diagnosis:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: Idempotency-Key
        in: header
        schema: { type: string, format: uuid }
        description: Required. A repeat with a different body is a 422.
    post:
      tags: [consultation]
      summary: Submit the diagnosis and end the consultation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagnosisCreate' }
      responses:
        '201':
          description: Accepted. Feedback generates asynchronously.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string, format: uuid }
                  feedback_ready: { type: boolean }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /sessions/{id}/feedback:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [consultation]
      summary: Feedback for a concluded consultation
      description: >
        Headings are *Diagnostic focus · History completeness · Evidence
        exploration*. Bias vocabulary never appears (CT-5).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feedback' }
        '404':
          description: Not ready yet; retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /sessions/{id}/feedback/rating:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [consultation]
      summary: Rate the feedback
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: >
                `was_helpful`, as API_CONTRACT §6 and `conclusion.py` have it
                (this said `helpful` until T-036). `comment` is not read.
              required: [was_helpful]
              properties:
                was_helpful: { type: boolean }
      responses:
        '204': { description: Recorded }

  /sessions/{id}/abandon:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [consultation]
      summary: Abandon a consultation
      description: Still counts against the monthly allowance (`PRD` FR-3).
      responses:
        '204': { description: Abandoned }

  # ── progress ───────────────────────────────────────────────────────
  /progress:
    get:
      tags: [history]
      summary: Trends across completed sessions
      description: Requires at least 3 completed sessions; below that, an empty state.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }

  # ── billing ────────────────────────────────────────────────────────
  /billing/checkout:
    post:
      tags: [billing]
      summary: Start Stripe checkout
      description: Regional pricing is resolved server-side from country (`PRD` D-5).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                interval: { type: string, enum: [month, year] }
      responses:
        '200':
          description: Redirect URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout_url: { type: string, format: uri }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /billing/portal:
    post:
      tags: [billing]
      summary: Open the Stripe billing portal
      responses:
        '200':
          description: Portal URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  portal_url: { type: string, format: uri }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /webhooks/stripe:
    post:
      tags: [billing]
      summary: Stripe webhook receiver
      description: >
        Signature-verified on every call — an unverified webhook endpoint is a
        "make me Pro" button. Idempotent by Stripe event id.
      security: []
      responses:
        '204': { description: Processed }
        '400': { description: Signature verification failed }
        '501': { $ref: '#/components/responses/NotImplemented' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued JWT, verified against JWKS (`ADR-0002`).

  responses:
    NotImplemented:
      description: >
        Not implemented. Every operation returns this until T-030; the contract
        exists first so the frontend can be built against it (sync point S-1).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Profile:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Profile' }
    Session:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Session' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >
                Stable identifier. Once shipped a code is never renamed or
                repurposed — clients branch on it.
              enum:
                - unauthenticated
                - token_expired
                # 503, not 401. Returned when the key server cannot be reached,
                # so the token CANNOT be checked — which is not the same as a
                # token that failed a check. A 401 here would send every client
                # into a refresh loop against an outage (T-014).
                - service_unavailable
                - forbidden
                - pro_required
                - monthly_limit_reached
                - not_found
                - feedback_not_ready
                - session_already_active
                - session_concluded
                - session_not_concluded
                - trial_already_used
                - no_approving_review
                - account_deleted
                - validation_failed
                - question_too_long
                - diagnosis_empty
                - diagnosis_too_long
                - patient_data_detected
                - keyword_overlap
                - idempotency_key_reused
                - confirmation_required
                - invalid_timezone
                - consent_version_required
                - trial_expired
                - unknown_key
                - question_limit_reached
                - rate_limited
                - patient_unavailable
                - no_cases_available
                - internal_error
                - not_implemented
            message: { type: string }
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
              description: Quote this to support; it correlates to the server logs.

    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, nullable: true }
        professional_role:
          type: string
          nullable: true
          enum: [medical_student, intern, resident, physician, other]
        year_of_training: { type: integer, minimum: 1, maximum: 10, nullable: true }
        country: { type: string, minLength: 2, maxLength: 2, nullable: true }
        timezone: { type: string, example: Asia/Kolkata }
        subscription_tier: { type: string, enum: [free, pro] }
        consent_research: { type: boolean }
        onboarded_at: { type: string, format: date-time, nullable: true }
        sessions_remaining_this_month:
          type: integer
          nullable: true
          description: >
            Free tier only. Shown on the dashboard, NEVER during a consultation
            (`PRD` P2).
        allowance_resets_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the free allowance resets — the first instant of the learner's
            next month, in their timezone. GET /me only; null for Pro. Drives
            S-08's "Your next free case unlocks on {date}".

    ProfileCreate:
      type: object
      description: >
        **Accepts every field `ProfileUpdate` does**, because `identity.py`
        validates both against one `_WRITABLE` set. This schema declared only
        `anonymous_id` and `timezone` until T-035, so a client generated from
        it could not set a display name at sign-up without a second PATCH —
        and nothing failed, because the server accepted fields the contract
        had never mentioned.
      properties:
        anonymous_id:
          type: string
          nullable: true
          description: Claims a trial session taken before signup.
        display_name: { type: string }
        professional_role:
          type: string
          enum: [medical_student, intern, resident, physician, other]
        year_of_training: { type: integer, minimum: 1, maximum: 10 }
        country: { type: string, minLength: 2, maxLength: 2 }
        timezone: { type: string }
        consent_research: { type: boolean }
        consent_version:
          type: string
          description: >
            Required when `consent_research` is true — the identifier of the
            document the user was actually shown. The server stamps
            `consent_at` itself; a caller that could choose it could backdate
            a consent.
        onboarded:
          type: boolean
          enum: [true]
          description: See ProfileUpdate.

    ProfileUpdate:
      type: object
      properties:
        display_name: { type: string }
        professional_role:
          type: string
          enum: [medical_student, intern, resident, physician, other]
        year_of_training: { type: integer, minimum: 1, maximum: 10 }
        country: { type: string, minLength: 2, maxLength: 2 }
        timezone: { type: string }
        consent_research: { type: boolean }
        consent_version:
          type: string
          description: >
            **Required when `consent_research` is true**, or the request is
            refused with `consent_version_required` — it identifies the
            document the user was actually shown. Absent from this schema
            until T-035, which meant a client generated from the contract had
            no way to send it and **could never give research consent at all**.
            The server stamps `consent_at`; a caller that could choose it
            could backdate a consent.
        onboarded:
          type: boolean
          enum: [true]
          description: >
            Ends onboarding (S-07), whether its questions were answered or
            skipped. The server stamps `onboarded_at` the first time and keeps
            it; `false` is refused — there is no un-onboarding.

    AccountDeletion:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: ['DELETE']
          description: >
            Must be exactly `DELETE`. S-20 is a full page, not a modal, and
            disables its button until the word is typed; this is the same
            guard on the server.

    ErasureAccepted:
      type: object
      required: [status, retained, completes_within_hours]
      properties:
        status: { type: string, enum: [erased] }
        retained:
          type: array
          items: { type: string }
          description: >
            What survives the erasure, in plain words. DATA_MODEL §10.2
            retains `session_results` and `research_pid` so published
            analyses stay interpretable, and UX_SPEC S-20 calls saying so
            "the ethical core of this screen" — so it travels with the
            response too, not only on the page before it.
        completes_within_hours:
          type: integer
          description: >
            When the three external steps finish — credential deletion,
            billing, confirmation email. S-20's 24 h.

    CatalogItem:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        group: { type: string }
        display_order: { type: integer }

    SessionCreate:
      type: object
      properties:
        confidence_pre:
          type: integer
          minimum: 1
          maximum: 5
          description: Self-rated confidence before starting (`PRD` FR-3).

    CasePresentation:
      type: object
      description: >
        Everything a learner may know about a case before asking anything, and
        nothing else. PRD FR-3.4 lists what must never appear here —
        correct_diagnosis, anchor_topic, anchor_keywords, required_topics,
        contradictory_clues, investigations, examination, system_prompt — and
        contract test CT-1 asserts the serialised response contains none of
        them.

        `nidan/api/v1/case_view.py` is the single serialiser, and it is built
        by naming the fields that go in rather than removing the ones that
        must not. case_versions.content is JSONB, so a new key needs no
        migration and no review; a deny-list would leak the first one anybody
        adds in a case-editor save.
      properties:
        title: { type: string }
        patient:
          type: object
          properties:
            name: { type: string }
            age: { type: integer }
            sex: { type: string }
            presenting_complaint: { type: string }
            intro: { type: string }
        opening_line: { type: string }

    TranscriptEntry:
      type: object
      description: >
        One turn. Carries `text` and nothing else from the stored event — a
        patient_reply payload may also hold `matched_topics` (DATA_MODEL
        §8.2), which is coverage state and would break CT-2 and PRD P2 if it
        reached a learner mid-consultation.
      properties:
        seq: { type: integer }
        type: { type: string, enum: [question, patient_reply] }
        text: { type: string }
        at: { type: string, format: date-time }

    ExaminationFinding:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        finding: { type: string }
        at: { type: string, format: date-time }

    Session:
      type: object
      description: >
        Deliberately carries NO assessment state — no coverage, no question
        count against a target, no topic hints, no readiness (CT-1, CT-2).

        There is no exception. `questions_remaining` was argued for in
        API_CONTRACT §6 and is **settled as absent** (API-6, 11 Nov 2026):
        §6 justified the field with "the UI surfaces it only when it
        approaches zero (UX_SPEC S-10)", and S-10's table "What is
        deliberately absent -- listed so no one adds them" opens with the
        row "Question counter | U2". The cap is a refusal, not a gauge.

        **Reconciled with API_CONTRACT §6 in T-030 slice 2b.** This schema had
        drifted from the prose spec — `id` for `session_id`, a flat `patient`
        with no case title, `{role, text}` transcript entries,
        `examinations_performed` for `examinations_done`, and no
        `questions_remaining` at all — and nothing compared the two, so
        neither side knew. T-032 generates the frontend types from this file,
        so the schema is what a client will actually be built against.
      properties:
        session_id: { type: string, format: uuid }
        sequence_index:
          type: integer
          description: Which consultation this is for the learner, from 1.
        status: { type: string, enum: [active, completed, abandoned, expired] }
        started_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time, nullable: true }
        is_repeat:
          type: boolean
          description: >
            PRD FR-3.2 — a repeated case must be marked, or the learner reads
            their own memory of the answer as clinical reasoning.
        case: { $ref: '#/components/schemas/CasePresentation' }
        transcript:
          type: array
          items: { $ref: '#/components/schemas/TranscriptEntry' }
        examinations_done:
          type: array
          items: { $ref: '#/components/schemas/ExaminationFinding' }
        investigations_done:
          type: array
          items: { $ref: '#/components/schemas/OrderResult' }
        # questions_remaining is NOT here, and that is settled rather than
        # pending (API-6, 11 Nov 2026). API_CONTRACT §6 used to say it should
        # be, citing UX_SPEC S-10 as surfacing it near zero; S-10 in fact
        # lists "Question counter | U2" first among the things it says no one
        # should add. §6 has been corrected.
        #
        # A client that wants the figure derives it: count `transcript`
        # entries whose `type` is "question". It is already in this response,
        # so the 40 keeps one home (API_CONTRACT §2.9, enforced server-side)
        # and nothing on the wire teaches the counter. The at-cap state comes
        # from the 429 `question_limit_reached`, whose `details` carry the
        # limit -- that is what drives S-10's disabled input.


    SessionPage:
      type: object
      description: >
        **Reconciled with API_CONTRACT §7 and `sessions.py` in T-037.** This
        said `items[].{id, diagnosis_verdict}` and a top-level `next_cursor`;
        the handler and §7 send `data[].{session_id, verdict, coverage_pct,
        ended_at}` and a `pagination` object. The T-033 dashboard was built
        from this schema and would have listed nothing against the real API.
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              session_id: { type: string, format: uuid }
              case_title: { type: string }
              status:
                type: string
                enum: [active, completed, abandoned, expired]
              verdict:
                type: string
                nullable: true
                enum: [correct, partial, anchored, other, null]
                description: Null for a session with no result — active or abandoned.
              coverage_pct: { type: number, nullable: true }
              started_at: { type: string, format: date-time }
              ended_at: { type: string, format: date-time, nullable: true }
        pagination:
          type: object
          properties:
            next_cursor: { type: string, nullable: true }
            has_more: { type: boolean }

    QuestionCreate:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 500 }

    PatientReply:
      type: object
      description: >
        What the patient said, and nothing about how the learner is doing.
        matched_topics is computed and stored on the patient_reply event
        (DATA_MODEL §8.2) and never returned — that is CT-2 and PRD FR-4.7.

        Neither `questions_asked` nor `questions_remaining` is here, and
        that is settled (API-6, 11 Nov 2026). The schema once carried
        `questions_asked` ("a running count only, never a count against a
        target") and API_CONTRACT §6's example once showed
        `questions_remaining`; both are gone. CLAUDE.md's rule is "no
        coverage meter, no question counter", and UX_SPEC S-10 lists
        "Question counter | U2" among the things it says no one should add.
        The 429 refusal carries the limit in `details`, so a learner who runs
        out is told why without a counter running all session.
      properties:
        seq: { type: integer }
        question:
          type: object
          properties:
            text: { type: string }
            at: { type: string, format: date-time }
        reply:
          type: object
          properties:
            text: { type: string }
            at: { type: string, format: date-time }

    OrderResult:
      type: object
      description: >
        Deliberately carries no `category` and no `is_key` (PRD FR-6.6). The
        case-specific/normal distinction IS the relevance signal, so it is
        stored on the event as was_case_specific and never returned.
      properties:
        key: { type: string }
        label: { type: string }
        result: { type: string }
        at: { type: string, format: date-time }
        already_ordered:
          type: boolean
          description: >
            True when the learner had already ordered this. The stored result
            is returned and no duplicate event is created (API_CONTRACT §6,
            PRD FR-5.3 and FR-6.3) — ordering the same test twice is one
            decision, and a duplicate would inflate the count the scorecard
            divides by.

    DiagnosisCreate:
      type: object
      description: >
        The field is `text`, as API_CONTRACT §6 and `conclusion.py` have it.
        This schema said `diagnosis` until T-034, so a client built from the
        generated types was refused with `diagnosis_empty` every time.
      required: [text]
      properties:
        text: { type: string, maxLength: 200 }
        # `confidence_post` was declared here and never read by
        # `conclusion.py` — raised as HANDOFF V-10.2 and settled in T-035 by
        # removing it. Storing it is not a one-line change: it needs a column
        # or an event-payload field, a migration, and a decision about whether
        # it belongs in the research export. A field a client can send and the
        # server silently discards is worse than no field, because it looks
        # like it works.
        #
        # Confidence CALIBRATION — comparing `confidence_pre` on
        # SessionCreate with a post-diagnosis figure — is a real and
        # well-evidenced teaching signal, and `PRD` FR-3 already captures the
        # "pre" half. If it is wanted it deserves a task, not a silent key.

    Feedback:
      type: object
      description: >
        Eight sections in a fixed order (`UX_SPEC` S-12). Headings are
        *Diagnostic focus · History completeness · Evidence exploration* —
        never bias vocabulary (CT-5).
        **Reconciled with API_CONTRACT §6 and `conclusion.py` in T-036.** This
        schema had drifted from both — `diagnosis_verdict`, a top-level
        `correct_diagnosis`, `narrative`, `generator: model|fallback`, and no
        summary, coverage or scorecards — while §6 and the handler agreed with
        each other. Nothing compares a response to its schema, so neither side
        knew until the web app was built from the types.
      properties:
        session_id: { type: string, format: uuid }
        diagnosis_submitted: { type: string }
        verdict:
          type: string
          enum: [correct, partial, anchored, other]
          description: >
            A machine value. `anchored` must never reach the screen (`PRD` P1);
            UX_SPEC S-13 renders it "Worth reconsidering".
        summary:
          type: object
          properties:
            question_count: { type: integer }
            examination_count: { type: integer }
            investigation_count: { type: integer }
            coverage_pct: { type: number }
            duration_seconds: { type: integer, nullable: true }
        tutor_feedback:
          type: object
          properties:
            lines:
              type: array
              items: { type: string }
            generator:
              type: string
              enum: [llm, rule_fallback]
              description: >
                `rule_fallback` means the model was unavailable and
                deterministic feedback was used. It renders identically and
                without apology.
        coverage:
          type: object
          properties:
            topics_hit:
              type: array
              items: { type: string }
              description: Topic keys, e.g. `pain_character`.
            topics_missed:
              type: array
              items: { type: string }
        examination_scorecard:
          type: object
          properties:
            key_done: { type: array, items: { type: string } }
            key_missed: { type: array, items: { type: string } }
            relevant_done: { type: array, items: { type: string } }
            extra_done: { type: array, items: { type: string } }
        investigation_scorecard:
          type: object
          properties:
            key_done: { type: array, items: { type: string } }
            key_missed: { type: array, items: { type: string } }
            reasonable_done: { type: array, items: { type: string } }
            low_value_done: { type: array, items: { type: string } }
            extra_done: { type: array, items: { type: string } }
        reasoning:
          type: array
          description: >
            Always all three, flagged or not, in this order. `id` is behavioural
            and the internal detector names never cross the API (CT-4, CT-5).
          items:
            type: object
            properties:
              id:
                type: string
                enum: [diagnostic_focus, history_completeness, evidence_exploration]
              label:
                type: string
                enum: [Diagnostic focus, History completeness, Evidence exploration]
              flagged: { type: boolean }
              status_line: { type: string, nullable: true }
              reason:
                type: string
                description: >
                  Cites the learner's own actions (`PRD` P3, `ADR-0004`).
        answer:
          type: object
          description: >
            Returned, and kept collapsed by the client until requested
            (`PRD` FR-8.8). §6's `trap_explanation` does not exist (API-8);
            `anchor_topic` is what there is.
          properties:
            correct_diagnosis: { type: string, nullable: true }
            anchor_topic: { type: string, nullable: true }

    Progress:
      type: object
      description: >
        **Reconciled with API_CONTRACT §7 and `account.py` in T-037** — this
        had a `trends` map and none of the streaks, the coverage series, the
        verdict distribution or `has_sufficient_data`. The figures are
        returned below three sessions too; `has_sufficient_data` is what tells
        a client to show S-16's empty state instead of a two-point "trend".
      properties:
        sessions_completed: { type: integer }
        current_streak_days: { type: integer }
        longest_streak_days: { type: integer }
        mean_coverage_last10: { type: number, nullable: true }
        has_sufficient_data: { type: boolean }
        coverage_series:
          type: array
          items:
            type: object
            properties:
              session_index: { type: integer }
              coverage_pct: { type: number }
              at: { type: string, format: date-time, nullable: true }
        reasoning_trends:
          type: array
          description: >
            Behavioural ids only (CT-4, CT-5). A rate is the share of the last
            ten (or the ten before) where the pattern was flagged; fewer is
            better, so a falling rate is `improving`. `direction` is null with
            no previous ten to compare.
          items:
            type: object
            properties:
              id:
                type: string
                enum: [diagnostic_focus, history_completeness, evidence_exploration]
              label:
                type: string
                enum: [Diagnostic focus, History completeness, Evidence exploration]
              last10_rate: { type: number, nullable: true }
              prev10_rate: { type: number, nullable: true }
              direction:
                type: string
                nullable: true
                enum: [improving, stable, declining, null]
        verdict_distribution:
          type: object
          properties:
            correct: { type: integer }
            partial: { type: integer }
            anchored: { type: integer }
            other: { type: integer }
